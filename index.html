<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CABINA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      padding: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #000000;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }

    .contenedor {

      width: 100%;

      max-width: 430px;

      background: #FFFFFF;

      border-radius: 20px;

      padding: 30px 25px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.35);

    }

    .logo {

      width: 100%;

      max-width: 260px;

      display: block;

      margin:
        0 auto 25px auto;

    }

    h1 {

      text-align: center;

      margin:
        0 0 25px 0;

      font-size: 25px;

      color: #222222;

    }

    label {

      display: block;

      margin-top: 15px;

      margin-bottom: 7px;

      font-weight: bold;

      color: #333333;

    }

    input[type="text"],
    input[type="email"] {

      width: 100%;

      padding: 14px;

      border:
        1px solid #CCCCCC;

      border-radius: 10px;

      font-size: 16px;

    }

    .experiencias {

      margin-top: 20px;

    }

    .opcion {

      display: flex;

      align-items: center;

      gap: 10px;

      border:
        1px solid #DDDDDD;

      border-radius: 10px;

      padding: 14px;

      margin-top: 10px;

      cursor: pointer;

    }

    .opcion input {

      width: 20px;

      height: 20px;

    }

    .opcion span {

      font-size: 16px;

    }

    button {

      width: 100%;

      margin-top: 25px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #111111;

      color: #FFFFFF;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }

    button:active {

      transform:
        scale(0.98);

    }

    button:disabled {

      opacity: 0.6;

      cursor: default;

    }

    #mensaje {

      text-align: center;

      margin-top: 15px;

      font-size: 15px;

      font-weight: bold;

    }

    /*
     * ==================================
     * PANTALLA CONFIRMACIÓN
     * ==================================
     */

    #pantallaConfirmacion {

      display: none;

      text-align: center;

    }

    #mensajeExito {

      color: #222222;

      font-size: 20px;

      font-weight: bold;

      line-height: 1.5;

    }

    #mensajePasoCabina {

      margin-top: 15px;

      color: #222222;

      font-size: 18px;

      line-height: 1.5;

    }

    /*
     * ==================================
     * PANTALLA CABINA OCUPADA
     * ==================================
     */

    #pantallaOcupada {

      display: none;

      text-align: center;

    }

    #mensajeOcupada {

      color: #222222;

      font-size: 20px;

      font-weight: bold;

      line-height: 1.4;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <img
      src="logoformulario.gif"
      alt="CABINA"
      class="logo"
      id="logo"
    >


    <!-- ==================================
         FORMULARIO
    =================================== -->

    <div id="contenidoFormulario">

      <h1 id="titulo">
        Ingresa a la experiencia
      </h1>


      <form id="formulario">


        <!-- ==================================
             CAMPOS DINÁMICOS
        =================================== -->

        <div id="camposFormulario"></div>


        <!-- ==================================
             EXPERIENCIAS DINÁMICAS
        =================================== -->

        <div class="experiencias">

          <label id="tituloExperiencias">
            Elige tu experiencia
          </label>

          <div id="listaExperiencias"></div>

        </div>


        <!-- ==================================
             BOTÓN
        =================================== -->

        <button
          type="submit"
          id="boton"
        >
          INGRESAR
        </button>


        <!-- ==================================
             MENSAJE
        ================================== -->

        <div id="mensaje"></div>


      </form>

    </div>


    <!-- ==================================
         CONFIRMACIÓN
    =================================== -->

    <div id="pantallaConfirmacion">

      <div id="mensajeExito">
        Datos ingresados correctamente.
      </div>

      <div id="mensajePasoCabina">
        Ahora puedes pasar a la cabina.
      </div>

    </div>


    <!-- ==================================
         CABINA OCUPADA
    =================================== -->

    <div id="pantallaOcupada">

      <div id="mensajeOcupada">
        Cabina ocupada. Espera un momento.
      </div>

    </div>


  </div>



  <script>


    /*
     * ==========================================
     * URL DE GOOGLE APPS SCRIPT
     * ==========================================
     */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwPH_9hWI_TaPSRoFdcTT73DStbsNYHl_NDrkxTJk3Xe5EVBVbu_KEVvyD_v3qNoRCT/exec";


    /*
     * ==========================================
     * VARIABLES
     * ==========================================
     */

    let estadoCabina =
      "DESCONOCIDO";


    let consultaEstadoEnCurso =
      false;


    let confirmacionActiva =
      false;


    let temporizadorConfirmacion =
      null;


    let mensajeExitoConfigurado =
      "Datos ingresados correctamente.";


    let mensajePasoCabinaConfigurado =
      "Ahora puedes pasar a la cabina.";


    let mensajeCabinaOcupadaConfigurado =
      "Cabina ocupada. Espera un momento.";



    /*
     * ==========================================
     * CONFIGURACIÓN RECIBIDA
     * ==========================================
     */

    window.cabinaConfigCallback =
      function(datos) {


        console.log(
          "Configuración CABINA recibida:",
          datos
        );


        /*
         * CONFIG_WEB1
         */

        const config =
          datos.configuracion || {};


        /*
         * MENSAJES
         */

        if (
          config.MENSAJE_EXITO
        ) {

          mensajeExitoConfigurado =
            config.MENSAJE_EXITO;

        }


        if (
          config.MENSAJE_PASO_CABINA
        ) {

          mensajePasoCabinaConfigurado =
            config.MENSAJE_PASO_CABINA;

        }


        if (
          config.MENSAJE_CABINA_OCUPADA
        ) {

          mensajeCabinaOcupadaConfigurado =
            config.MENSAJE_CABINA_OCUPADA;

        }


        /*
         * TÍTULO
         */

        if (config.TITULO) {

          document
            .getElementById("titulo")
            .textContent =
              config.TITULO;

        }


        /*
         * TEXTO BOTÓN
         */

        if (config.TEXTO_BOTON) {

          document
            .getElementById("boton")
            .textContent =
              config.TEXTO_BOTON;

        }


        /*
         * COLORES
         */

        if (config.COLOR_FONDO) {

          document.body.style.background =
            config.COLOR_FONDO;

        }


        if (config.COLOR_PANEL) {

          document
            .querySelector(".contenedor")
            .style.background =
              config.COLOR_PANEL;

        }


        if (config.COLOR_TEXTO) {

          document
            .getElementById("titulo")
            .style.color =
              config.COLOR_TEXTO;

          document
            .getElementById("mensajeExito")
            .style.color =
              config.COLOR_TEXTO;

          document
            .getElementById("mensajePasoCabina")
            .style.color =
              config.COLOR_TEXTO;

          document
            .getElementById("mensajeOcupada")
            .style.color =
              config.COLOR_TEXTO;

        }


        if (config.COLOR_BOTON) {

          document
            .getElementById("boton")
            .style.background =
              config.COLOR_BOTON;

        }


        if (config.COLOR_TEXTO_BOTON) {

          document
            .getElementById("boton")
            .style.color =
              config.COLOR_TEXTO_BOTON;

        }


        /*
         * TAMAÑO LOGO
         */

        if (config.TAMANO_LOGO) {

          document
            .getElementById("logo")
            .style.maxWidth =
              config.TAMANO_LOGO + "px";

        }


        /*
         * TAMAÑO TÍTULO
         */

        if (config.TAMANO_TITULO) {

          document
            .getElementById("titulo")
            .style.fontSize =
              config.TAMANO_TITULO + "px";

        }


        /*
         * TAMAÑO BOTÓN
         */

        if (config.TAMANO_BOTON) {

          document
            .getElementById("boton")
            .style.fontSize =
              config.TAMANO_BOTON + "px";

        }


        /*
         * ANCHO PANEL
         */

        if (config.ANCHO_PANEL) {

          document
            .querySelector(".contenedor")
            .style.maxWidth =
              config.ANCHO_PANEL + "px";

        }


        /*
         * RADIO PANEL
         */

        if (config.RADIO_PANEL) {

          document
            .querySelector(".contenedor")
            .style.borderRadius =
              config.RADIO_PANEL + "px";

        }


        /*
         * TAMAÑO TEXTO
         */

        if (config.TAMANO_TEXTO) {

          const inputs =
            document.querySelectorAll(
              'input[type="text"], input[type="email"]'
            );


          inputs.forEach(
            function(input) {

              input.style.fontSize =
                config.TAMANO_TEXTO + "px";

            }
          );

        }


        /*
         * ==================================
         * CAMPOS_WEB1
         * ==================================
         */

        const campos =
          datos.campos || [];


        const contenedorCampos =
          document.getElementById(
            "camposFormulario"
          );


        contenedorCampos.innerHTML =
          "";


        campos.sort(
          function(a, b) {

            return Number(a.orden)
              -
              Number(b.orden);

          }
        );


        campos.forEach(
          function(campo) {


            const label =
              document.createElement(
                "label"
              );


            label.textContent =
              campo.texto;


            label.setAttribute(
              "for",
              campo.campo
            );


            const input =
              document.createElement(
                "input"
              );


            if (
              campo.campo ===
              "EMAIL"
            ) {

              input.type =
                "email";

            } else {

              input.type =
                "text";

            }


            input.id =
              campo.campo;


            input.name =
              campo.campo;


            input.required =
              true;


            contenedorCampos.appendChild(
              label
            );


            contenedorCampos.appendChild(
              input
            );

          }
        );


        /*
         * ==================================
         * EXPERIENCIAS
         * ==================================
         */

        const experiencias =
          datos.experiencias || [];


        const listaExperiencias =
          document.getElementById(
            "listaExperiencias"
          );


        listaExperiencias.innerHTML =
          "";


        experiencias.forEach(
          function(experiencia) {


            /*
             * SOLO ACTIVAS
             */

            if (
              !experiencia.activa
            ) {

              return;

            }


            const label =
              document.createElement(
                "label"
              );


            label.className =
              "opcion";


            const input =
              document.createElement(
                "input"
              );


            input.type =
              "radio";


            input.name =
              "experiencia";


            input.value =
              experiencia.id;


            input.required =
              true;


            const span =
              document.createElement(
                "span"
              );


            span.textContent =
              experiencia.nombre;


            label.appendChild(
              input
            );


            label.appendChild(
              span
            );


            listaExperiencias.appendChild(
              label
            );

          }
        );


        /*
         * ==================================
         * CONSULTAR ESTADO
         * ==================================
         */

        consultarEstadoCabina();

      };



    /*
     * ==========================================
     * CARGAR CONFIGURACIÓN
     * ==========================================
     */

    const scriptConfig =
      document.createElement("script");


    scriptConfig.src =
      URL_APPS_SCRIPT +
      "?prefix=cabinaConfigCallback" +
      "&t=" +
      Date.now();


    document.head.appendChild(
      scriptConfig
    );



    /*
     * ==========================================
     * CONSULTAR ESTADO DE CABINA
     * ==========================================
     */

    function consultarEstadoCabina() {


      if (
        consultaEstadoEnCurso
      ) {

        return;

      }


      consultaEstadoEnCurso =
        true;


      const nombreCallback =
        "respuestaEstado_" +
        Date.now();


      window[nombreCallback] =
        function(resultado) {


          console.log(
            "ESTADO CABINA:",
            resultado
          );


          consultaEstadoEnCurso =
            false;


          if (
            resultado &&
            resultado.estado
          ) {

            estadoCabina =
              String(
                resultado.estado
              ).toUpperCase();

          }


          actualizarPantallaCabina();


          delete window[
            nombreCallback
          ];


          scriptEstado.remove();

        };


      const scriptEstado =
        document.createElement(
          "script"
        );


      scriptEstado.src =
        URL_APPS_SCRIPT +
        "?accion=estado" +
        "&prefix=" +
        encodeURIComponent(
          nombreCallback
        ) +
        "&t=" +
        Date.now();


      scriptEstado.onerror =
        function() {


          console.error(
            "No se pudo consultar el estado de la cabina."
          );


          consultaEstadoEnCurso =
            false;


          delete window[
            nombreCallback
          ];


          scriptEstado.remove();

        };


      document.body.appendChild(
        scriptEstado
      );

    }



    /*
     * ==========================================
     * ACTUALIZAR PANTALLA
     * ==========================================
     */

    function actualizarPantallaCabina() {


      /*
       * Mientras mostramos la confirmación
       * no debemos cambiar inmediatamente
       * a la pantalla OCUPADA.
       */

      if (
        confirmacionActiva
      ) {

        return;

      }


      const formulario =
        document.getElementById(
          "contenidoFormulario"
        );


      const pantallaConfirmacion =
        document.getElementById(
          "pantallaConfirmacion"
        );


      const pantallaOcupada =
        document.getElementById(
          "pantallaOcupada"
        );


      if (
        estadoCabina ===
        "OCUPADA"
      ) {

        formulario.style.display =
          "none";

        pantallaConfirmacion.style.display =
          "none";

        pantallaOcupada.style.display =
          "block";

      } else {

        formulario.style.display =
          "block";

        pantallaConfirmacion.style.display =
          "none";

        pantallaOcupada.style.display =
          "none";

      }

    }



    /*
     * ==========================================
     * MOSTRAR CONFIRMACIÓN
     * ==========================================
     */

    function mostrarConfirmacion() {


      const formulario =
        document.getElementById(
          "contenidoFormulario"
        );


      const pantallaConfirmacion =
        document.getElementById(
          "pantallaConfirmacion"
        );


      const pantallaOcupada =
        document.getElementById(
          "pantallaOcupada"
        );


      document
        .getElementById(
          "mensajeExito"
        )
        .textContent =
          mensajeExitoConfigurado;


      document
        .getElementById(
          "mensajePasoCabina"
        )
        .textContent =
          mensajePasoCabinaConfigurado;


      document
        .getElementById(
          "mensajeOcupada"
        )
        .textContent =
          mensajeCabinaOcupadaConfigurado;


      confirmacionActiva =
        true;


      formulario.style.display =
        "none";


      pantallaOcupada.style.display =
        "none";


      pantallaConfirmacion.style.display =
        "block";


      /*
       * Esperar 5 segundos antes
       * de pasar a OCUPADA.
       */

      if (
        temporizadorConfirmacion
      ) {

        clearTimeout(
          temporizadorConfirmacion
        );

      }


      temporizadorConfirmacion =
        setTimeout(
          function() {


            confirmacionActiva =
              false;


            pantallaConfirmacion.style.display =
              "none";


            actualizarPantallaCabina();


          },
          5000
        );

    }



    /*
     * ==========================================
     * ACTUALIZAR ESTADO CADA 2 SEGUNDOS
     * ==========================================
     */

    setInterval(
      consultarEstadoCabina,
      2000
    );



    /*
     * ==========================================
     * ENVIAR REGISTRO
     * ==========================================
     */

    document
      .getElementById("formulario")
      .addEventListener(
        "submit",
        function(event) {


          /*
           * EVITAR RECARGA
           */

          event.preventDefault();


          /*
           * SEGURIDAD EXTRA
           */

          if (
            estadoCabina ===
            "OCUPADA"
          ) {

            actualizarPantallaCabina();

            return;

          }


          /*
           * ELEMENTOS
           */

          const boton =
            document.getElementById(
              "boton"
            );


          const mensaje =
            document.getElementById(
              "mensaje"
            );


          /*
           * OBTENER DATOS
           */

          const nombreApellido =
            document
              .getElementById(
                "NOMBRE_APELLIDO"
              )
              ?.value
              .trim() || "";


          const email =
            document
              .getElementById(
                "EMAIL"
              )
              ?.value
              .trim() || "";


          const experienciaSeleccionada =
            document.querySelector(
              'input[name="experiencia"]:checked'
            );


          const experiencia =
            experienciaSeleccionada
              ? experienciaSeleccionada.value
              : "";


          /*
           * VALIDACIÓN
           */

          if (
            !nombreApellido ||
            !email ||
            !experiencia
          ) {

            mensaje.textContent =
              "Completa todos los campos.";

            return;

          }


          /*
           * DESHABILITAR BOTÓN
           */

          boton.disabled =
            true;


          boton.textContent =
            "ENVIANDO...";


          mensaje.textContent =
            "";


          /*
           * ==================================
           * CONSTRUIR URL
           * ==================================
           */

          const url =
            URL_APPS_SCRIPT +
            "?accion=registrar" +
            "&nombreApellido=" +
            encodeURIComponent(
              nombreApellido
            ) +
            "&email=" +
            encodeURIComponent(
              email
            ) +
            "&experiencia=" +
            encodeURIComponent(
              experiencia
            ) +
            "&t=" +
            Date.now();


          /*
           * ==================================
           * ENVIAR REGISTRO Y ESPERAR RESPUESTA
           * ==================================
           */

          const nombreCallback =
            "respuestaRegistro_" +
            Date.now();


          window[nombreCallback] =
            function(resultado) {


              console.log(
                "RESPUESTA REGISTRO:",
                resultado
              );


              /*
               * CABINA OCUPADA
               */

              if (
                resultado &&
                resultado.ocupada === true
              ) {

                estadoCabina =
                  "OCUPADA";


                mostrarPantallaOcupadaDirecta();


                delete window[
                  nombreCallback
                ];


                scriptRegistro.remove();

                return;

              }


              /*
               * REGISTRO CORRECTO
               */

              if (
                resultado &&
                resultado.ok === true
              ) {

                /*
                 * El servidor ya dejó
                 * la cabina en OCUPADA.
                 */

                estadoCabina =
                  "OCUPADA";


                /*
                 * Mostrar primero la
                 * confirmación al usuario.
                 */

                mostrarConfirmacion();


                delete window[
                  nombreCallback
                ];


                scriptRegistro.remove();

                return;

              }


              /*
               * RESPUESTA NO ESPERADA
               */

              mensaje.textContent =
                "No fue posible registrar la experiencia.";


              boton.disabled =
                false;


              boton.textContent =
                "INGRESAR";


              delete window[
                nombreCallback
              ];


              scriptRegistro.remove();

            };


          const scriptRegistro =
            document.createElement(
              "script"
            );


          scriptRegistro.src =
            url +
            "&prefix=" +
            encodeURIComponent(
              nombreCallback
            );


          scriptRegistro.onerror =
            function() {


              console.error(
                "No se pudo contactar Apps Script."
              );


              mensaje.textContent =
                "No fue posible conectar con la cabina.";


              boton.disabled =
                false;


              boton.textContent =
                "INGRESAR";


              delete window[
                nombreCallback
              ];


              scriptRegistro.remove();

            };


          document.body.appendChild(
            scriptRegistro
          );


        }
      );



    /*
     * ==========================================
     * MOSTRAR OCUPADA DIRECTAMENTE
     * ==========================================
     */

    function mostrarPantallaOcupadaDirecta() {


      const formulario =
        document.getElementById(
          "contenidoFormulario"
        );


      const pantallaConfirmacion =
        document.getElementById(
          "pantallaConfirmacion"
        );


      const pantallaOcupada =
        document.getElementById(
          "pantallaOcupada"
        );


      confirmacionActiva =
        false;


      formulario.style.display =
        "none";


      pantallaConfirmacion.style.display =
        "none";


      document
        .getElementById(
          "mensajeOcupada"
        )
        .textContent =
          mensajeCabinaOcupadaConfigurado;


      pantallaOcupada.style.display =
        "block";

    }


  </script>


</body>

</html>
