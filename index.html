<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CABINA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
        }

        .logo {
            width: 100%;
            max-width: 260px;
            display: block;
            margin: 0 auto 25px auto;
        }

        h1 {
            text-align: center;
            margin: 0 0 25px 0;
            font-size: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .experiencias {
            margin-top: 20px;
        }

        .opcion {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            cursor: pointer;
        }

        .opcion input {
            width: 20px;
            height: 20px;
        }

        .opcion span {
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <img src="logoformulario.png" alt="CABINA" class="logo">

        <h1>Ingresa a la experiencia</h1>

        <form id="formulario">

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <div class="experiencias">

                <label>Elige tu experiencia</label>

                <label class="opcion">
                    <input
                        type="radio"
                        name="experiencia"
                        value="experiencia01"
                        required
                    >
                    <span>Experiencia 01</span>
                </label>

                <label class="opcion">
                    <input
                        type="radio"
                        name="experiencia"
                        value="experiencia02"
                    >
                    <span>Experiencia 02</span>
                </label>

            </div>

            <button type="submit">
                INGRESAR
            </button>

        </form>

    </div>

</body>
</html>
